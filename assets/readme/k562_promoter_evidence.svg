<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">K562 promoter evidence by expression stratum</title>
  <desc id="desc">In a descriptive reference-comparable K562 analysis, promoter ATAC evidence was 39.89 percent in the bottom expression stratum and 78.67 percent in the top; promoter H3K27ac evidence was 9.04 and 66.83 percent.</desc>
  <rect width="1000" height="540" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #24323d; }
    .flag { font-size: 13px; font-weight: 700; fill: #8a4f21; letter-spacing: 0.6px; }
    .title { font-size: 24px; font-weight: 650; }
    .subtitle { font-size: 14px; fill: #52626f; }
    .label { font-size: 15px; font-weight: 600; }
    .value { font-size: 14px; font-weight: 650; }
    .axis { font-size: 12px; fill: #61717d; }
  </style>
  <text x="42" y="34" class="flag">DESCRIPTIVE / REFERENCE_COMPARABLE</text>
  <text x="42" y="70" class="title">K562 promoter evidence by expression stratum</text>
  <text x="42" y="96" class="subtitle">Separately released public experiments; not matched aliquots and not a causal comparison.</text>

  <g stroke="#d9e0e5" stroke-width="1">
    <line x1="130" y1="145" x2="930" y2="145"/>
    <line x1="130" y1="215" x2="930" y2="215"/>
    <line x1="130" y1="285" x2="930" y2="285"/>
    <line x1="130" y1="355" x2="930" y2="355"/>
    <line x1="130" y1="425" x2="930" y2="425"/>
  </g>
  <text x="112" y="429" text-anchor="end" class="axis">0%</text>
  <text x="112" y="359" text-anchor="end" class="axis">25%</text>
  <text x="112" y="289" text-anchor="end" class="axis">50%</text>
  <text x="112" y="219" text-anchor="end" class="axis">75%</text>
  <text x="112" y="149" text-anchor="end" class="axis">100%</text>

  <rect x="215" y="313.3" width="92" height="111.7" fill="#7896ad"/>
  <rect x="327" y="204.7" width="92" height="220.3" fill="#315b7d"/>
  <text x="261" y="300" text-anchor="middle" class="value">39.89%</text>
  <text x="373" y="192" text-anchor="middle" class="value">78.67%</text>
  <text x="317" y="461" text-anchor="middle" class="label">Promoter ATAC</text>

  <rect x="595" y="399.7" width="92" height="25.3" fill="#7896ad"/>
  <rect x="707" y="237.9" width="92" height="187.1" fill="#315b7d"/>
  <text x="641" y="387" text-anchor="middle" class="value">9.04%</text>
  <text x="753" y="225" text-anchor="middle" class="value">66.83%</text>
  <text x="697" y="461" text-anchor="middle" class="label">Promoter H3K27ac</text>

  <rect x="263" y="493" width="18" height="12" fill="#7896ad"/>
  <text x="289" y="504" class="subtitle">Bottom expression</text>
  <rect x="492" y="493" width="18" height="12" fill="#315b7d"/>
  <text x="518" y="504" class="subtitle">Top expression</text>
</svg>
